        const bm = new Map((idArr(B) ? B : []).map(r => [r.id, r])), mm = new Map(M.map(r => [r.id, r]));
        const res = T.slice(), pos = new Map(res.map((r, i) => [r.id, i]));
        mm.forEach((r, id) => {
          const b = bm.get(id);
          if (b && same(r, b)) return;                        /* у меня запись не менялась */
          if (pos.has(id)) {
            const t = res[pos.get(id)];
            if (b && !same(t, b) && !same(t, r)) disputes++;  /* поменяли на обоих устройствах */
            res[pos.get(id)] = r;
          } else if (!b) { pos.set(id, res.length); res.push(r); } /* добавил я */
          else disputes++;                                    /* я поменял, а там удалили — оставляю удаление */
        });
        bm.forEach((b, id) => {                               /* удалил я */
          if (mm.has(id) || !pos.has(id)) return;
          const i = pos.get(id); if (!same(res[i], b)) disputes++;
          res[i] = null;
        });
        out[k] = res.filter(Boolean);
        if (k === 'log') out[k].sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
        return;
      }
      if (M && T && typeof M === 'object' && typeof T === 'object' && !Array.isArray(M) && !Array.isArray(T)) {
        const o = Object.assign({}, T), b = B && typeof B === 'object' ? B : {};
        Object.keys(M).forEach(f => { if (!same(M[f], b[f])) { if (!same(T[f], b[f]) && !same(T[f], M[f])) disputes++; o[f] = M[f]; } });
        Object.keys(b).forEach(f => { if (!(f in M) && same(T[f], b[f])) delete o[f]; });
        out[k] = o; return;
      }
      disputes++; out[k] = M;
    });
    return { data: out, disputes };
  }

  async function cloudStateSave() {
    await idb.set('cl.cur', JSON.stringify(D));
    await idb.set('cl.meta', { baseMd5: cl.baseMd5, pending: cl.pending, last: cl.last ? cl.last.toISOString() : null });
  }
  /* открыть базу с Диска (сначала мгновенно показываем копию с устройства) */
  async function cloudOpen() {
    cloud = true; ui.fileName = 'Яндекс Диск'; cl.empty = false;
    /* просим браузер не удалять копию базы на устройстве при нехватке места */
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    const meta = (await idb.get('cl.meta')) || {};
    cl.baseMd5 = meta.baseMd5 || null; cl.pending = !!meta.pending; cl.last = meta.last ? new Date(meta.last) : null;
    cl.baseJson = (await idb.get('cl.base')) || null;
    const cur = await idb.get('cl.cur');
    if (cur) { D = normalize(JSON.parse(cur)); reindex(); histReset(); dirty = false; render(); }
    else render();
    await cloudSync();
    clearInterval(cl.pull); cl.pull = setInterval(() => { if (!document.hidden) cloudSync(); }, 60000);
    afterOpen(); mirrorQueue(true);
  }
  function cloudQueue() {
    cl.pending = true; dirty = true; paintStatus(); mirrorQueue();
    idb.set('cl.cur', JSON.stringify(D)); idb.set('cl.meta', { baseMd5: cl.baseMd5, pending: true, last: cl.last ? cl.last.toISOString() : null });
    clearTimeout(cl.timer); cl.timer = setTimeout(cloudSync, 2000);
  }
  async function cloudSync() {
    if (!cloud) return;
    if (cl.busy) { cl.again = true; return; }
    if (!yaToken()) { cl.needLogin = true; paintStatus(); render(); return; }
    cl.busy = true; cl.err = ''; paintStatus();
    try {
      const meta = await yaMeta(CLOUD_FILE);
      cl.offline = false; cl.needLogin = false;
      if (!meta) {
        if (D) await cloudUpload();
        else { cl.empty = true; render(); }
      } else if (cl.baseMd5 && meta.md5 === cl.baseMd5) {
        if (cl.pending) await cloudUpload();
      } else {
        /* на Диске другая версия: её сохранили с другого устройства */
        if (cl.pending && D && (ui.editor || ui.sale)) { cl.deferred = true; }
        else {
          const theirsJson = await yaGet(CLOUD_FILE), theirs = JSON.parse(theirsJson);
          if (cl.pending && D) {
            const baseObj = cl.baseJson ? JSON.parse(cl.baseJson) : {}, mineObj = JSON.parse(JSON.stringify(D));
            const { data, disputes } = merge3(baseObj, mineObj, theirs);
            const renum = mergeRenum(baseObj, mineObj, theirs, data);
            D = normalize(data); reindex(); histReset();
            if (renum.length) ui.renumNote = renum;
            cl.baseMd5 = meta.md5; cl.baseJson = theirsJson;
            await cloudUpload();
            toast('Объединил с изменениями с другого устройства' + (disputes ? ` (спорных записей: ${disputes} — оставил вариант с этого устройства)` : '') + (renum.length ? '. Номера нарядов: ' + renum.map(r => '№ ' + r[0] + ' → № ' + r[1]).join(', ') : ''), 9000);
            if (renum.length) render();
          } else if (ui.editor || ui.sale) { cl.deferred = true; }
          else {
            const first = !D;
            D = normalize(theirs); reindex(); histReset();
            cl.baseMd5 = meta.md5; cl.baseJson = theirsJson; cl.pending = false; cl.last = new Date(); dirty = false;
            await idb.set('cl.base', theirsJson); await cloudStateSave();
            if (ui.cdraft) { const c = ui.cdraft.id && D.clients.find(x => x.id === ui.cdraft.id); ui.cdraft = c ? clone(c) : null; }
            render(); mirrorQueue();
            if (!first) toast('Загружены изменения с другого устройства');
          }
        }
      }
      if (D && !cl.pending) cloudDailyCopy();
    } catch (e) {
      if (e.offline) cl.offline = true; else cl.err = e.message || String(e);
      clearTimeout(cl.timer); cl.timer = setTimeout(cloudSync, 30000);
    }
    cl.busy = false; paintStatus();
    if (cl.needLogin) render();
    if (cl.again) { cl.again = false; setTimeout(cloudSync, 300); }
  }
  async function cloudUpload() {
    const json = JSON.stringify(D);
    await yaPut(CLOUD_FILE, json);
    const m = await yaMeta(CLOUD_FILE);
    cl.baseMd5 = m && m.md5; cl.baseJson = json; cl.pending = false; cl.last = new Date(); dirty = false; ui.savedAt = cl.last;
    await idb.set('cl.base', json); await cloudStateSave();
  }
  async function cloudDailyCopy() {
    const day = S.todayISO();
    if (lsGet('cl.copyDay') === day) return;
    try {
      await yaMkdir(CLOUD_COPIES);
      const name = CLOUD_COPIES + '/AGservice-база ' + day + '.json.gz';
      if (!(await yaMeta(name))) await yaPut(name, JSON.stringify(D));
      lsSet('cl.copyDay', day);
      const list = await yaApi('/resources?path=' + encodeURIComponent(CLOUD_COPIES) + '&limit=200&fields=_embedded.items.name,_embedded.items.path');
      const items = ((list && list._embedded && list._embedded.items) || []).filter(x => /^AGservice-база \d{4}-\d{2}-\d{2}\.json\.gz$/.test(x.name)).sort((a, b) => a.name.localeCompare(b.name));
      while (items.length > CLOUD_KEEP) { const x = items.shift(); try { await yaApi('/resources?path=' + encodeURIComponent(x.path) + '&permanently=true', { method: 'DELETE' }); } catch (e) {} }
      ui.cloudCopies = { last: day, count: Math.min(items.length, CLOUD_KEEP) };
    } catch (e) {}
  }
  /* загрузить базу на Диск с этого компьютера (первый перенос или замена) */
  async function cloudUploadFile(file) {
    try {
      const data = JSON.parse(await file.text());
      if (!data || (!data.orders && !data.pays)) throw new Error('в файле нет данных учёта');
      ui.cloudReplace = { name: file.name, data }; render();
    } catch (e) { ui.error = 'Файл не подходит: ' + e.message; render(); }
  }
  async function cloudReplaceDo() {
    const r = ui.cloudReplace; if (!r) return;
    ui.cloudReplace = null;
    const hadBase = !!D;
    const L = D && D.log ? D.log : null;
    D = normalize(r.data); if (L && !r.data.log) D.log = L;
    reindex(); histReset();
    cloud = true; ui.fileName = 'Яндекс Диск'; cl.empty = false; lsSet('ag.mode', 'cloud');
    if (!hadBase) { clearInterval(cl.pull); cl.pull = setInterval(() => { if (!document.hidden) cloudSync(); }, 60000); afterOpen(); }
    try {
      if (hadBase && cl.baseJson) { /* старая версия на Диске остаётся копией */
        await yaMkdir(CLOUD_COPIES);
        await yaPut(CLOUD_COPIES + '/до замены ' + new Date().toISOString().slice(0, 16).replace(/[T:]/g, '-') + '.json.gz', cl.baseJson);
      }
      await cloudUpload(); toast('База загружена на Яндекс Диск'); lsSet('cl.copyDay', null); cloudDailyCopy();
    } catch (e) { cl.pending = true; await cloudStateSave(); toast('Не получилось отправить: ' + e.message + '. Отправлю, когда будет связь.'); clearTimeout(cl.timer); cl.timer = setTimeout(cloudSync, 30000); }
    render();
  }
  window.addEventListener('online', () => { if (cloud) cloudSync(); });
  document.addEventListener('visibilitychange', () => { if (cloud && !document.hidden) cloudSync(); });

  /* ---------- черновик открытого наряда / продажи: переживёт отключение света ---------- */
  let draftTimer = 0, draftLast = '';
  function draftTick() {
    const st = ui.editor ? { kind: 'order', s: ui.editor } : ui.sale ? { kind: 'sale', s: ui.sale } : null;
    if (!st) { if (draftLast) { draftLast = ''; idb.set('draft', null); } return; }
    let j; try { j = JSON.stringify(st.s); } catch (e) { return; }
    if (j === draftLast) return;
    draftLast = j;
    idb.set('draft', { kind: st.kind, at: new Date().toISOString(), json: j, num: st.kind === 'order' ? st.s.order && st.s.order.num : null, who: st.kind === 'order' ? (st.s.order && st.s.order.client) || '' : st.s.client || '' });
  }
  function draftStart() { clearInterval(draftTimer); draftTimer = setInterval(draftTick, 3000); }
  function draftClear() { draftLast = ''; idb.set('draft', null); }
  async function draftCheck() {
    const d = await idb.get('draft');
    if (!d || !d.json) return;
    if (Date.now() - new Date(d.at).getTime() > 7 * 864e5) { idb.set('draft', null); return; }
    ui.draftOffer = d; render();
  }
  function draftRestore() {
    const d = ui.draftOffer; ui.draftOffer = null; if (!d) return;
    try { const s = JSON.parse(d.json); if (d.kind === 'order') { ui.editor = s; paintEditor(true); } else { ui.sale = s; paintSale(true); } toast('Черновик восстановлен — проверь и нажми «Сохранить»'); }
    catch (e) { toast('Черновик не читается'); }
    render();
  }
  function afterOpen() { draftStart(); draftCheck(); }

  /* ---------- подсказки ---------- */
  function paintLists() {
    if (!D) return;
    $('#dl-clients').innerHTML = (X.crows || []).map(r => `<option value="${esc(label(r.p) + ' — ' + (r.c ? r.c.car : ''))}"></option>`).join('');
    $('#dl-works').innerHTML = D.workTypes.map(w => `<option value="${esc(w.name)}">${w.price ? esc(fmt(w.price) + ' ₽') : ''}</option>`).join('');
    $('#dl-stock').innerHTML = D.stock.map(s => `<option value="${esc(s.art)}">${esc(s.name)}</option>`).join('');
    { const fx = $('#dl-fixed'); if (fx) fx.innerHTML = (D.cfg.fixedNames || []).map(n => `<option value="${esc(n)}"></option>`).join(''); }
    $('#dl-names').innerHTML = nameList().map(n => `<option value="${esc(n)}"></option>`).join('');
    $('#dl-sups').innerHTML = (D.cfg.suppliers || []).map(n => `<option value="${esc(n)}"></option>`).join('');
  }

  /* ---------- запуск ---------- */
  (async () => {
    ui.start.lastName = (await idb.get('lastName')) || '';
    await copyInit();
    render();
    if (isWeb && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
    if (isWeb && yaToken() && lsGet('ag.mode') !== 'file') { lsSet('ag.mode', 'cloud'); cloudOpen(); }
  })();
  render();
  window.__sto = { get D() { return D; }, mergeTest: (b, m, t) => { const r = merge3(b, m, t); return { data: r.data, disputes: r.disputes, renum: mergeRenum(b, m, t, r.data) }; }, rkSet: d => { ui.rk = { data: d, name: 'test' }; ui.rkCheck = true; X._rk = null; render(); }, get ui() { return ui; }, payT: { payEffects, effText }, get X() { return X; }, copyTest: async h => { copyDir = h; copyDoneDay = ''; await copyDaily(true); return ui.copyInfo; }, logRollback: id => logRollback(id), mirrorTest: async h => { copyDir = h; await mirrorWrite(false); return ui.copyInfo; }, open: h => loadFromHandle(h), load: d => { D = normalize(d); reindex(); histReset(); ui.fileName = 'проверка'; render(); }, openOrder };
})();
