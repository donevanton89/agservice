<style>
/* Раскладка: узкая рабочая колонка «как бланк заказ-наряда», сверху вкладки, карточки нарядов списком; редактор — полноэкранный лист. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f6f8fb; --ink: #162030; --muted: #5b687c; --line: #d6dce6;
  --accent: #1f4aa8; --accent-ink: #ffffff; --accent-soft: #e3eafb;
  --work: #9a5b00; --work-soft: #fdf0d9; --ok: #17724a; --ok-soft: #dcf3e7; --bad: #b42318; --bad-soft: #fde4e1;
  --plate-bg: #ffffff; --plate-ink: #0d0d0d; --plate-line: #0d0d0d;
  --f-display: "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif;
  --f-body: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Cascadia Mono", Consolas, ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme]) {
  --bg: #0e131b; --surface: #161e2b; --surface-2: #1b2534; --ink: #e4e9f1; --muted: #93a0b4; --line: #2a3546;
  --accent: #86a6ff; --accent-ink: #0b1220; --accent-soft: #1d2a47;
  --work: #f2b14e; --work-soft: #3a2c14; --ok: #5fd39b; --ok-soft: #14352a; --bad: #ff8a7a; --bad-soft: #3d1c1a; color-scheme: dark } }
:root[data-theme="warm"] {
  --bg: #f3eee5; --surface: #fffdf9; --surface-2: #f8f3eb; --ink: #2b2219; --muted: #74685a; --line: #e3d9ca;
  --accent: #b9480f; --accent-ink: #ffffff; --accent-soft: #fbe6d8;
  --work: #9a5b00; --work-soft: #fbedd3; --ok: #2f7a3e; --ok-soft: #e0f0dc; --bad: #b42318; --bad-soft: #fbe1dc; color-scheme: light }
:root[data-theme="sand"] {
  --bg: #efede4; --surface: #fdfcf7; --surface-2: #f5f3ea; --ink: #23251c; --muted: #6a6c5d; --line: #dedbcd;
  --accent: #4f6b2c; --accent-ink: #ffffff; --accent-soft: #e5ecd6;
  --work: #9a5b00; --work-soft: #f8ecd2; --ok: #2f7a3e; --ok-soft: #e0efd9; --bad: #b42318; --bad-soft: #fbe1dc; color-scheme: light }
:root[data-theme="light"] { color-scheme: light }
:root[data-theme="dark"] {
  --bg: #0e131b; --surface: #161e2b; --surface-2: #1b2534; --ink: #e4e9f1; --muted: #93a0b4; --line: #2a3546;
  --accent: #86a6ff; --accent-ink: #0b1220; --accent-soft: #1d2a47;
  --work: #f2b14e; --work-soft: #3a2c14; --ok: #5fd39b; --ok-soft: #14352a; --bad: #ff8a7a; --bad-soft: #3d1c1a; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); font-variant-numeric: tabular-nums; }
body.locked { overflow: hidden; }

<script>/* СТО Учёт — ядро: чтение Excel, перенос данных, расчёты. Работает и в браузере, и в Node. */
(function (G) {
  const STO = (G.STO = G.STO || {});

  /* ---------- даты и месяцы ---------- */
  const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  const MONTHS_CAP = MONTHS.map(m => m[0].toUpperCase() + m.slice(1));
  const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  STO.MONTHS_CAP = MONTHS_CAP;
  STO.MONTHS_GEN = MONTHS_GEN;

  function pad(n) { return String(n).padStart(2, '0'); }
  function serialToISO(n) {
    const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n * 86400000));
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function monthOf(iso) { return iso ? iso.slice(0, 7) : null; }
  function monthFromText(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return monthOf(serialToISO(v));
    const m = String(v).trim().toLowerCase().match(/^([а-яё]+)\s+(\d{4})$/);
    if (!m) return null;
    const i = MONTHS.indexOf(m[1]);
    return i < 0 ? null : m[2] + '-' + pad(i + 1);
  }
  function monthLabel(key) {
    if (!key) return '';
    const [y, m] = key.split('-');
    return MONTHS_CAP[+m - 1] + ' ' + y;
  }
  function addMonths(key, k) {
    let [y, m] = key.split('-').map(Number);
    m += k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; }
    return y + '-' + pad(m);
  }
  function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  Object.assign(STO, { pad, serialToISO, monthOf, monthFromText, monthLabel, addMonths, todayISO });

  /* ---------- чтение .xlsx/.xlsm без библиотек ---------- */
  async function inflateRaw(u8) {
    const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  async function unzip(buf, want) {
    const u8 = new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let e = u8.length - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error('Это не файл Excel (.xlsx/.xlsm)');
    const n = dv.getUint16(e + 10, true);
    let p = dv.getUint32(e + 16, true);
    const td = new TextDecoder(), out = {};
    for (let i = 0; i < n; i++) {
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      const lo = dv.getUint32(p + 42, true);
      const name = td.decode(u8.subarray(p + 46, p + 46 + nl));
      p += 46 + nl + xl + cl;
      if (!want(name)) continue;
      const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
      const raw = u8.subarray(start, start + csize);
      out[name] = td.decode(method === 0 ? raw : await inflateRaw(raw));
    }
    return out;
  }
  const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };
  function unx(s) {
    return s
      .replace(/&(#x[0-9a-f]+|#\d+|\w+);/gi, (m, c) =>
        c[0] === '#' ? String.fromCodePoint(/x/i.test(c[1]) ? parseInt(c.slice(2), 16) : parseInt(c.slice(1), 10)) : ENT[c] ?? m)
      .replace(/_x([0-9A-Fa-f]{4})_/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
  }
  function attr(tag, name) {
    const m = tag.match(new RegExp('\\s' + name + '="([^"]*)"'));
    return m ? m[1] : null;
  }
  function texts(xml) {
    let s = '';
    xml = xml.replace(/<rPh[\s\S]*?<\/rPh>/g, '');
    const re = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g;
    let m;
    while ((m = re.exec(xml))) s += m[1];
    return unx(s);
  }
  function parseSheet(xml, sst) {
    const rows = {};
    const re = /<c r="([A-Z]+)(\d+)"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let m;
    while ((m = re.exec(xml))) {
      const inner = m[4];
      if (inner == null) continue;
      const t = attr(m[3], 't');
      let val = null;
      if (t === 'inlineStr') val = texts(inner);
      else {
        const v = inner.match(/<v>([\s\S]*?)<\/v>/);
        if (!v) continue;
        const raw = v[1];
        if (t === 's') val = sst[+raw];
        else if (t === 'str') val = unx(raw);
        else if (t === 'b') val = raw === '1';
        else if (t === 'e') val = null;
        else val = parseFloat(raw);
      }
      if (val === null || val === '' || (typeof val === 'number' && isNaN(val))) continue;
      (rows[+m[2]] = rows[+m[2]] || {})[m[1]] = val;
    }
    return rows;
  }
  async function readWorkbook(buf) {
    const files = await unzip(buf, n => n === 'xl/workbook.xml' || n === 'xl/_rels/workbook.xml.rels' || n === 'xl/sharedStrings.xml' || /^xl\/worksheets\/sheet\d+\.xml$/.test(n));
    const sst = [];
    if (files['xl/sharedStrings.xml']) {
      const re = /<si>([\s\S]*?)<\/si>/g;
      let m;
      while ((m = re.exec(files['xl/sharedStrings.xml']))) sst.push(texts(m[1]));
    }
    const rels = {};
    (files['xl/_rels/workbook.xml.rels'].match(/<Relationship\s[^>]*>/g) || []).forEach(tag => {
      rels[attr(tag, 'Id')] = attr(tag, 'Target');
    });
    const sheets = {};
    (files['xl/workbook.xml'].match(/<sheet\s[^>]*>/g) || []).forEach(tag => {
      const name = unx(attr(tag, 'name'));
      let target = rels[attr(tag, 'r:id')] || '';
      target = target.replace(/^\/?xl\//, '').replace(/^\//, '');
      const xml = files['xl/' + target];
      if (xml) sheets[name] = parseSheet(xml, sst);
    });
    return sheets;
  }
  STO.readWorkbook = readWorkbook;

  /* ---------- перенос из Работа.xlsm ---------- */
  function txt(v) {
    if (v == null) return '';
    const s = String(v).trim();
    return s === '—' || s === '-' ? '' : s;
  }
  function num(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return v;
    const s = String(v).replace(/\s/g, '').replace(',', '.');
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  }
  function dt(v) { return typeof v === 'number' && v > 1000 ? serialToISO(v) : null; }
  function lastRow(rows) { return Math.max(0, ...Object.keys(rows).map(Number)); }
  const r2 = x => Math.round(x * 100) / 100;
  const low = s => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
  STO.low = low;

  const DEFAULT_MARKUP = [
    { upTo: 500, k: 1.3 }, { upTo: 1000, k: 1.28 }, { upTo: 5000, k: 1.25 }, { upTo: 10000, k: 1.22 }, { upTo: null, k: 1.2 },
  ];
  STO.DEFAULT_MARKUP = DEFAULT_MARKUP;
  const DEFAULT_FIXED = ['Налог', 'Аренда', 'Бухгалтер', 'Электричество', 'Взносы', 'Эквайринг', 'Аренда терминала'];
  STO.DEFAULT_FIXED = DEFAULT_FIXED;
  STO.CASH_TYPES = ['Наличные', '₽'];
  STO.PAY_TYPES = ['Наличные', 'безнал', '₽/безнал', 'Карта', 'QR'];
  STO.ACCOUNTS = ['Антон', 'Глеб', 'Копилка', 'Масло/антифриз', 'ИП карта (Антон)'];

  function emptyData() {
    return {
      v: 2,
      cfg: { params: [], markup: DEFAULT_MARKUP, suppliers: ['Rossko', 'ПП', 'Mikado', 'ОЗОН'], balanceSuppliers: ['Rossko', 'ПП', 'Mikado'], fixedNames: DEFAULT_FIXED, closed: {} },
      orders: [], parts: [], pays: [], stock: [], workTypes: [], clients: [], schedule: [],
    };
  }
  STO.emptyData = emptyData;

  function transform(S) {
    const need = ['Работа', 'Запчасти+расходы', 'Платежи', 'Склад', 'Вид работ', 'Клиенты', 'Итог'];
    const miss = need.filter(n => !S[n]);
    if (miss.length) throw new Error('В файле нет листов: ' + miss.join(', '));
    const today = todayISO();
    const D = emptyData();

    /* наряды и работы (лист «Работа») */
    const W = S['Работа'];
    const groups = [];
    const byNum = {};
    let cur = null;
    for (let r = 3, L = lastRow(W); r <= L; r++) {
      const row = W[r];
      if (!row) continue;
      if (!['B', 'D', 'E', 'F', 'G', 'L', 'N', 'O', 'P', 'Q'].some(c => row[c] != null && row[c] !== '')) continue;
      const n = num(row.B);
      if (n != null) {
        if (byNum[n]) { byNum[n].rows.push({ r, row }); continue; }
        cur = { num: n, key: 'n' + n, rows: [] };
        groups.push(cur); byNum[n] = cur;
      } else {
        const prev = cur && cur.num == null && cur.rows[cur.rows.length - 1].row;
        const same = prev && txt(prev.F) === txt(row.F) && txt(prev.G) === txt(row.G) && prev.E === row.E && prev.D === row.D && row.Q == null;
        if (!same) { cur = { num: null, key: 'x' + r, rows: [] }; groups.push(cur); }
      }
      cur.rows.push({ r, row });
    }
    D.orders = groups.map(g => {
      const first = f => { for (const { row } of g.rows) { const v = txt(row[f]); if (v) return v; } return ''; };
      const works = [];
      let paid = 0, allDone = true, maxDone = null, minStart = null, mileage = null;
      g.rows.forEach(({ r, row }) => {
        const done = dt(row.D), start = dt(row.E);
        if (!done) allDone = false; else if (!maxDone || done > maxDone) maxDone = done;
        if (start && (!minStart || start < minStart)) minStart = start;
        if (mileage == null && num(row.M) != null) mileage = num(row.M);
        paid += num(row.Q) || 0;
        if (txt(row.L) || num(row.N) || num(row.O) || num(row.P) || done) {
          works.push({ id: 'w' + r, name: txt(row.L), sum: num(row.N) || 0, sub: num(row.O) || 0, nik: num(row.P) || 0, done });
        }
      });
      const o = {
        id: g.key, num: g.num, client: first('F'), car: first('G'), note: first('H'), vin: first('I'), plate: first('J'),
        phone: first('K'), mileage, start: minStart, doneDate: allDone && g.rows.length ? maxDone : null, works, paid: r2(paid),
        R: g.rows.reduce((s, { row }) => s + (typeof row.R === 'number' ? row.R : 0), 0),
      };
      if (o.note === '0') o.note = '';
      return o;
    });

    /* запчасти и расходы */
    const Z = S['Запчасти+расходы'];
    let blk = null;
    for (let r = 3, L = lastRow(Z); r <= L; r++) {
      const row = Z[r];
      if (!row) continue;
      if (!['E', 'F', 'H', 'I', 'K', 'O', 'U', 'L'].some(c => row[c] != null && row[c] !== '')) continue;
      const date = dt(row.B);
      if (row.L != null || row.U != null) blk = 'p' + r;
      const p = {
        id: 'p' + r, date, sup: txt(row.C), order: num(row.D), art: txt(row.E), name: txt(row.F).replace(/\s*\n\s*/g, ' '), brand: txt(row.G),
        cost: num(row.H), qty: num(row.I) || 0, price: num(row.J), sum: num(row.K) || 0, client: txt(row.O), car: txt(row.P),
        note: txt(row.Q), vin: txt(row.R), plate: txt(row.S), phone: txt(row.T), paid: num(row.U),
        no: txt(row.W).toUpperCase() === 'НЕТ', ret: txt(row.M) === 'Возврат', retDone: !!txt(row.N),
        month: monthFromText(row.A) || monthOf(date) || monthOf(today), blk: blk || 'p' + r,
      };
      if (blk === 'p' + r) p.V = typeof row.V === 'number' ? row.V : 0;
      if (p.sup === 'Озон') p.sup = 'ОЗОН';
      D.parts.push(p);
    }

    /* платежи — все движения денег */
    const P = S['Платежи'];
    for (let r = 3, L = lastRow(P); r <= L; r++) {
      const row = P[r];
      if (!row) continue;
      const date = dt(row.A), amount = num(row.E);
      if (!date || amount == null) continue;
      let type = txt(row.G);
      if (type === '₽') type = 'Наличные';
      const H = txt(row.H);
      D.pays.push({
        id: 'y' + r, date, order: num(row.C), amount, type, receipt: H === 'Да' ? true : H === 'Нет' ? false : null,
        name: String(row.I ?? '').trim().replace(/\s+/g, ' '), note: txt(row.J),
      });
    }

    /* склад */
    const K = S['Склад'];
    for (let r = 2, L = lastRow(K); r <= L; r++) {
      const row = K[r];
      if (!row || !txt(row.B) || txt(row.B) === 'ЗАПЧАСТИ') continue;
      D.stock.push({ id: 's' + r, art: txt(row.B), name: txt(row.C), brand: txt(row.D), cost: num(row.E), price: num(row.G), qtyBase: r2(num(row.F) || 0), oil: r < 8 });
    }

    /* справочники */
    const V = S['Вид работ'];
    const sups = [];
    for (let r = 1, L = lastRow(V); r <= L; r++) {
      const row = V[r];
      if (!row) continue;
      if (r > 1 && txt(row.D) && txt(row.D) !== 'Склад') sups.push(txt(row.D));
      if (r === 1) { if (txt(row.D)) sups.push(txt(row.D)); continue; }
      if (txt(row.A)) D.workTypes.push({ name: txt(row.A), price: num(row.B) });
    }
    if (sups.length) D.cfg.suppliers = sups;
    const C = S['Клиенты'];
    for (let r = 2, L = lastRow(C); r <= L; r++) {
      const row = C[r];
      if (!row || !txt(row.A)) continue;
      D.clients.push({ name: txt(row.A), note: txt(row.B), car: txt(row.C), vin: txt(row.D), plate: txt(row.E), phone: txt(row.F) });
    }
    D.orders.forEach(o => { if (isPhone(o.plate)) { if (!o.phone) o.phone = normPhone(o.plate); o.plate = ''; } });
    D.clients = buildClients(D.clients, D.orders);
    const R = S['Расписание'];
    if (R) for (let r = 2, L = lastRow(R); r <= L; r++) {
      const row = R[r];
      if (!row || !dt(row.A)) continue;
      D.schedule.push({ id: 'r' + r, date: dt(row.A), client: txt(row.B), car: txt(row.C), note: txt(row.D) });
    }

    /* параметры налога, названия статей, закрытые месяцы */
    const Iz = S['Итог'];
    const fx = ['B', 'C', 'D', 'E', 'F', 'G', 'H'].map(c => String((Iz[89] && Iz[89][c]) ?? '').trim().replace(/\s+/g, ' ')).filter(Boolean);
    if (fx.length) D.cfg.fixedNames = fx;
    for (let r = 92; r <= 101; r++) {
      const row = Iz[r];
      if (!row || !dt(row.B)) continue;
      D.cfg.params.push({
        from: monthOf(dt(row.B)), usn: num(row.C) || 0, extra: num(row.D) || 0, rent: num(row.E) || 0, acc: num(row.F) || 0,
        elec: num(row.G) || 0, vznosYear: num(row.H) || 0, acqCard: num(row.I) || 0, acqQr: num(row.J) || 0, term: num(row.K) || 0,
      });
    }
    const IR = S['Итог_расчёт'];
    if (IR && IR[4] && IR[91]) {
      Object.keys(IR[91]).forEach(col => {
        if (col === 'A') return;
        const d = dt(IR[91][col]);
        const m = monthFromText(IR[4][col]);
        if (!d || !m) return;
        D.cfg.closed[m] = { date: d, works: num(IR[92]?.[col]) || 0, stoProfit: num(IR[93]?.[col]) || 0, partsProfit: num(IR[94]?.[col]) || 0, stoExp: num(IR[95]?.[col]) || 0, itogo: num(IR[96]?.[col]) || 0 };
      });
    }
    D.cfg.importedAt = new Date().toISOString();
    D.cfg.importedRows = { works: D.orders.reduce((s, o) => s + o.works.length, 0), parts: D.parts.length, pays: D.pays.length };
    return D;
  }
  STO.transform = transform;

  /* ---------- клиенты: человек (имя + прозвище) и его машины ---------- */
  function isPhone(v) { const s = String(v || ''); const d = s.replace(/\D/g, ''); return d.length >= 10 && d.length <= 12 && !/[A-Za-zА-Яа-яЁё]/.test(s); }
  function normPhone(v) { let d = String(v || '').replace(/\D/g, ''); if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1); return d.length === 11 ? '+' + d : String(v || '').trim(); }
  function clientLabel(p) { return p ? (p.name + (p.nick ? ' ' + p.nick : '')).trim() : ''; }
  function clientKey(name, nick) { return low(name) + '|' + low(nick); }
  /* Из старого вида (строка = имя + машина) собирает людей со списком машин и привязывает к ним наряды */
  function buildClients(rows, orders) {
    const persons = [], byKey = {};
    let n = 0;
    rows.forEach(r => {
      let plate = r.plate || '', phone = r.phone || '';
      if (isPhone(plate)) { if (!phone) phone = plate; plate = ''; }
      const k = clientKey(r.name, r.note);
      let p = byKey[k];
      if (!p) { p = { id: 'c' + ++n, name: r.name, nick: r.note || '', phone: '', cars: [] }; byKey[k] = p; persons.push(p); }
      if (phone && !p.phone) p.phone = normPhone(phone);
      if (r.car || r.vin || plate) {
        const same = p.cars.find(c => (r.vin && c.vin === r.vin) || (!r.vin && !c.vin && low(c.car) === low(r.car)));
        if (same) { if (!same.plate && plate) same.plate = plate; }
        else p.cars.push({ id: p.id + 'a' + (p.cars.length + 1), car: r.car || '', plate, vin: r.vin || '' });
      }
    });
    const byLabel = {};
    persons.forEach(p => { const l = low(clientLabel(p)); if (!byLabel[l]) byLabel[l] = p; });
    (orders || []).forEach(o => {
      const p = byKey[clientKey(o.client, o.note)] || byLabel[low((o.client + ' ' + (o.note || '')).trim())] || byLabel[low(o.client)];
      if (!p) return;
      o.cid = p.id;
      const c = p.cars.find(c => o.vin && c.vin === o.vin) || p.cars.find(c => o.plate && c.plate === o.plate) || p.cars.find(c => low(c.car) === low(o.car));
      if (c) o.carId = c.id;
    });
    /* клиенты, которые есть только в нарядах (нет в листе «Клиенты»): заводим их тоже, кроме безымянных «Клиент» */
    (orders || []).slice().sort((a, b) => (b.start || b.doneDate || '').localeCompare(a.start || a.doneDate || '')).forEach(o => {
      if (o.cid || !o.client || low(o.client) === 'клиент') return;
      const k = clientKey(o.client, o.note);
      let p = byKey[k];
      if (!p) { p = { id: 'c' + ++n, name: o.client, nick: o.note || '', phone: o.phone ? normPhone(o.phone) : '', cars: [] }; byKey[k] = p; persons.push(p); }
      o.cid = p.id;
      let c = p.cars.find(c => (o.vin && c.vin === o.vin) || (!o.vin && low(c.car) === low(o.car)));
      if (!c && (o.car || o.vin || o.plate)) { c = { id: p.id + 'a' + (p.cars.length + 1), car: o.car || '', plate: o.plate || '', vin: o.vin || '' }; p.cars.push(c); }
      if (c) o.carId = c.id;
    });
    return persons;
  }
  Object.assign(STO, { isPhone, normPhone, clientLabel, clientKey, buildClients });

  /* ---------- вставка из выгрузки магазина ---------- */
  function parsePaste(text) {
    const rows = String(text || '').replace(/\r/g, '').split('\n').map(l => l.split('\t').map(c => c.trim())).filter(r => r.some(c => c));
    if (!rows.length) return { items: [], header: false };
    const toNum = s => { const n = parseFloat(String(s).replace(/\s| /g, '').replace(/[₽р]|руб\.?/gi, '').replace(',', '.')); return isNaN(n) ? null : n; };
    const map = { art: -1, name: -1, brand: -1, price: -1, qty: -1 };
    const h = rows[0].map(low);
    const find = re => h.findIndex(x => re.test(x));
    const header = h.some(x => /артикул|номер|код|наимен|описан|назван|бренд|производ|цена|кол|заказ/.test(x));
    if (header) {
      map.art = find(/артикул|номер|код/); map.name = find(/наимен|описан|назван|товар/); map.brand = find(/бренд|производ|марка/);
      map.price = find(/цена|стоим/); map.qty = find(/кол|заказ|шт/);
      rows.shift();
    }
    if (map.art < 0 && map.name < 0) Object.assign(map, { art: 0, name: 1, brand: 2, price: 3, qty: 4 });
    if (map.price < 0) map.price = 3;
    if (map.qty < 0) map.qty = 4;
    const items = rows.map(r => ({
      art: map.art >= 0 ? r[map.art] || '' : '', name: map.name >= 0 ? r[map.name] || '' : '', brand: map.brand >= 0 ? r[map.brand] || '' : '',
      cost: toNum(r[map.price] ?? ''), qty: toNum(r[map.qty] ?? '') ?? 1,
    })).filter(it => (it.art || it.name) && it.cost != null);
    return { items, header };
  }
  STO.parsePaste = parsePaste;

  /* ---------- вставка, скопированная прямо со страницы сайта (корзина/заказ Rossko и похожие) ----------
     Каждое поле на своей строке: «Бренд Артикул», название, доставка…, цена, «N шт.», сумма. */
  const MON_RU = ['январ', 'феврал', 'март', 'апрел', 'ма', 'июн', 'июл', 'август', 'сентябр', 'октябр', 'ноябр', 'декабр'];
  function splitBrandArt(s, brands, htmlMap) {
    const t = String(s || '').replace(/^\[|\]\(.*\)$/g, '').trim();
    const key = t.replace(/\s+/g, '').toLowerCase();
    if (htmlMap && htmlMap[key]) return htmlMap[key];
    let best = '';
    (brands || []).forEach(b => { const bb = b.replace(/\s+/g, '').toLowerCase(); if (bb && key.startsWith(bb) && key.length > bb.length && bb.length > best.replace(/\s+/g, '').length) best = b; });
    if (best) {
      let n = 0, i = 0; const bl = best.replace(/\s+/g, '').length;
      while (i < t.length && n < bl) { if (!/\s/.test(t[i])) n++; i++; }
      return { brand: best, art: t.slice(i).trim() };
    }
    if (/\s/.test(t)) {
      const k = t.lastIndexOf(' '); let brand = t.slice(0, k).trim(), art = t.slice(k + 1);
      const m = art.match(/^([A-Za-zА-Яа-яЁё]*[a-zа-яё])([A-Z0-9].*)$/);
      if (m) { brand += ' ' + m[1]; art = m[2]; }
      return { brand, art };
    }
    for (let i = 1; i < t.length; i++) {
      const a = t[i - 1], b = t[i];
      if ((/[a-zа-яё]/.test(a) && /[A-ZА-ЯЁ0-9]/.test(b)) || (/[A-Za-zА-Яа-яЁё]/.test(a) && /[0-9]/.test(b))) return { brand: t.slice(0, i), art: t.slice(i) };
    }
    return { brand: '', art: t };
  }
  function htmlBrandMap(html) {
    const map = {};
    if (!html || typeof DOMParser === 'undefined') return map;
    try {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('a').forEach(a => {
        const parts = [];
        const walk = n => n.childNodes.forEach(c => { if (c.nodeType === 3) { const v = c.textContent.trim(); if (v) parts.push(v); } else walk(c); });
        walk(a);
        if (parts.length >= 2) map[parts.join('').replace(/\s+/g, '').toLowerCase()] = { brand: parts[0], art: parts.slice(1).join('') };
      });
    } catch (e) {}
    return map;
  }
  function parseSitePaste(text, html, brands, today) {
    const raw = String(text || '').replace(/\r/g, '').split('\n').map(l => l.replace(/ /g, ' ').trim()).filter(Boolean);
    const isQty = l => /^\d+(?:[.,]\d+)?\s*шт\.?$/i.test(l);
    if (!raw.some(isQty)) return null;
    const num = l => /^-?[\d\s]+(?:[.,]\d+)?\s*(?:₽|руб\.?|р\.)?$/i.test(l) ? parseFloat(l.replace(/[^\d,.-]/g, '').replace(',', '.')) : null;
    const isDate = l => /^\d{1,2}\s+(январ|феврал|март|апрел|ма[йя]|июн|июл|август|сентябр|октябр|ноябр|декабр)/i.test(l);
    const isNoise = l => l === 'i' || /^отменить$|^удалить$/i.test(l) || /склад|в пути|в наличии|под заказ|^\d+\s+(на|в)\s/i.test(l) || /^с \d{1,2}:\d{2}/.test(l);
    const map = htmlBrandMap(html), items = [];
    let start = 0, lastDelivery = '';
    for (let i = 0; i < raw.length; i++) {
      if (!isQty(raw[i])) continue;
      const qty = parseFloat(raw[i].replace(',', '.'));
      let pi = i - 1; while (pi >= start && num(raw[pi]) == null) pi--;
      const cost = pi >= start ? num(raw[pi]) : null;
      const sumLine = i + 1 < raw.length && num(raw[i + 1]) != null ? i + 1 : -1;
      const rec = raw.slice(start, pi >= start ? pi : i);
      start = (sumLine > 0 ? sumLine : i) + 1;
      if (cost == null || !rec.length) continue;
      const head = rec[0];
      const nameLines = [];
      for (let k = 1; k < rec.length; k++) { if (isDate(rec[k]) || isNoise(rec[k])) break; nameLines.push(rec[k]); }
      const dl = rec.find(isDate);
      if (dl) {
        const m = dl.match(/^(\d{1,2})\s+([а-яё]+)/i), mi = MON_RU.findIndex(x => m[2].toLowerCase().startsWith(x));
        if (mi >= 0) { const td = today || new Date().toISOString().slice(0, 10); let y = +td.slice(0, 4); if (mi + 1 < +td.slice(5, 7) - 6) y++;
          const d = y + '-' + String(mi + 1).padStart(2, '0') + '-' + String(+m[1]).padStart(2, '0'); if (d > lastDelivery) lastDelivery = d; }
      }
      const ba = splitBrandArt(head, brands, map);
      items.push({ art: ba.art, brand: ba.brand, name: nameLines.join(' '), cost, qty: isNaN(qty) ? 1 : qty });
    }
    const site = /rossko/i.test(html || '') || /rossko/i.test(text || '') ? 'Rossko' : '';
    return { items, header: false, site, delivery: lastDelivery };
  }
  STO.parseSitePaste = parseSitePaste;

  /* Mikado (portal.mikado-parts.ru): «БРЕНД · АРТИКУЛ», название, количество, цена за штуку «1 850,88 ₽», дальше доставка и статус */
  function parseMikadoPaste(text) {
    const lines = String(text || '').replace(/\r/g, '').split('\n').map(l => l.replace(/ /g, ' ').trim()).filter(Boolean);
    const headRe = /^\[?(.+?)\s+[·•]\s+([^\]\s][^\]]*?)\]?(?:\(.*\))?$/;
    const isHead = l => headRe.test(l) && !/₽/.test(l);
    if (!lines.some(isHead)) return null;
    const price = l => /^[\d\s]+(?:[.,]\d+)?\s*(?:₽|р\.?|руб\.?)$/i.test(l) ? parseFloat(l.replace(/[^\d,.]/g, '').replace(',', '.')) : null;
    const items = [];
    for (let i = 0; i < lines.length; i++) {
      if (!isHead(lines[i])) continue;
      const m = lines[i].match(headRe);
      let j = i + 1; const name = [];
      while (j < lines.length && !isHead(lines[j]) && !/^\d+(?:[.,]\d+)?$/.test(lines[j]) && price(lines[j]) == null) { if (!/^new$/i.test(lines[j])) name.push(lines[j]); j++; }
      let qty = 1, cost = null;
      if (j < lines.length && /^\d+(?:[.,]\d+)?$/.test(lines[j])) { qty = parseFloat(lines[j].replace(',', '.')); j++; }
      if (j < lines.length && price(lines[j]) != null) cost = price(lines[j]);
      if (cost == null) continue;
      items.push({ brand: m[1].trim(), art: m[2].trim().replace(/\s+NEW$/i, ''), name: name.join(' '), cost, qty });
    }
    return { items, header: false, site: 'Mikado', delivery: '' };
  }
  STO.parseMikadoPaste = parseMikadoPaste;

  /* ПП (история заказов на сайте): строки через Tab —
     дата время | № заказа | № позиции | (картинка) | бренд | артикул | название | склад | вес | срок | дата поставки | заказано | кол-во 2 | цена за шт. | сумма | статус */
  function parsePPPaste(text) {
    const rows = String(text || '').replace(/\r/g, '').split('\n').map(l => l.replace(/ /g, ' ').split('\t').map(c => c.trim()));
    const isRow = c => /^\d{2}\.\d{2}\.\d{4}(\s+\d{1,2}:\d{2}(:\d{2})?)?$/.test(c[0] || '') && c.length >= 10;
    if (!rows.some(isRow)) return null;
    const num = v => { const t = String(v || '').replace(/\s/g, '').replace(',', '.'); return t !== '' && !isNaN(+t) ? +t : null; };
    const items = [];
    rows.filter(isRow).forEach(c => {
      let d = -1;
      for (let i = 3; i < c.length; i++) if (/^\d{2}\.\d{2}\.\d{4}$/.test(c[i])) { d = i; break; }
      if (d < 0) return;
      const qty = num(c[d + 1]), cost = num(c[d + 3]);
      if (cost == null) return;
      const mid = c.slice(3, d).filter(Boolean);           /* бренд, артикул, название, склад, вес, срок */
      const brand = mid[0] || '', art = mid[1] || '', name = mid[2] || '';
      const m = c[0].match(/^(\d{2})\.(\d{2})\.(\d{4})/);
      items.push({ brand, art, name, cost, qty: qty || 1, date: m ? m[3] + '-' + m[2] + '-' + m[1] : '', status: c[d + 5] || '' });
    });
    return { items, header: false, site: 'ПП', delivery: '' };
  }
  STO.parsePPPaste = parsePPPaste;
  STO.splitBrandArt = splitBrandArt;

  /* ---------- расчёты ---------- */
  function paramsFor(cfg, month) {
    let p = null;
    (cfg.params || []).slice().sort((a, b) => (a.from < b.from ? -1 : 1)).forEach(x => { if (x.from <= month) p = x; });
    return p;
  }
  function taxStart(cfg) { return (cfg.params || []).map(p => p.from).sort()[0] || null; }
  function markupPrice(cfg, cost) {
    if (cost == null) return null;
    for (const t of (cfg && cfg.markup) || DEFAULT_MARKUP) if (t.upTo == null || cost <= t.upTo) return r2(cost * t.k);
    return cost;
  }
  Object.assign(STO, { paramsFor, taxStart, markupPrice });

  function index(D) {
    const ordersByNum = {}, ordersById = {}, partsByOrder = {}, paysByOrder = {}, stockByArt = {}, blocks = {};
    D.orders.forEach(o => { ordersById[o.id] = o; if (o.num != null) ordersByNum[o.num] = o; });
    D.parts.forEach(p => {
      if (p.order != null) (partsByOrder[p.order] = partsByOrder[p.order] || []).push(p);
      if (p.blk) (blocks[p.blk] = blocks[p.blk] || []).push(p);
    });
    D.pays.forEach(p => { if (p.order != null) (paysByOrder[p.order] = paysByOrder[p.order] || []).push(p); });
    D.stock.forEach(s => { stockByArt[s.art] = s; });
    const lastPay = D.pays.reduce((m, p) => (p.date > m ? p.date : m), '');
    return { ordersByNum, ordersById, partsByOrder, paysByOrder, stockByArt, blocks, lastPay, fixed: new Set((D.cfg.fixedNames || DEFAULT_FIXED).map(low)) };
  }
  STO.index = index;

  function partPeriod(p, X) {
    if (p.order == null || p.keepMonth || !p.date || p.date < '2026-10-01') return p.month;
    const o = X.ordersByNum[p.order];
    return o && o.doneDate ? monthOf(o.doneDate) : 'work';
  }
  STO.partPeriod = partPeriod;
  /* себестоимость проданного масла: закупка, запомненная в момент продажи (p.oilCost, с 10.11.2026);
     если не запомнена — текущая закупка из карточки склада */
  const oilCostOf = (p, X) => {
    const s = X.stockByArt[p.art];
    if (!s || !s.oil || p.client === 'СТО (масло/антифриз)') return 0;
    const c = p.oilCost != null && p.oilArt === p.art ? p.oilCost : s.cost;
    return c ? c * (p.qty || 0) : 0;
  };
  STO.oilCostOf = oilCostOf;

  /* Долг блока запчастей, как столбец V в Excel: оплачено − (сумма − возвраты) */
  function blockDebt(rows) {
    const st = rows[0];
    if (st && 'V' in st && !rows.some(p => p.app || p.edited)) return -(st.V || 0);
    /* adj — замороженная разница со старым Excel (переезд 08.11.2026): старый долг не «прыгает» после правок */
    let L = 0, U = 0, A = 0;
    rows.forEach(p => { if (!p.ret) L += p.sum || 0; if (p.paid != null) U += p.paid; if (p.adj) A += p.adj; });
    return L - U + A;
  }
  /* Долг по работам, как столбец R: сумма сделанных работ − оплачено */
  function appPaid(o, X) { return o.num != null ? (X.paysByOrder[o.num] || []).reduce((s, p) => (p.app ? s + p.amount : s), 0) : 0; }
  function worksDebt(o, X) {
    if ('R' in o && !o.edited) return -(o.R || 0);
    return o.works.reduce((s, w) => s + (w.done ? w.sum || 0 : 0), 0) - (o.paid || 0) - appPaid(o, X) + (o.adj || 0);
  }

  function orderTotals(o, X) {
    const works = o.works.reduce((s, w) => s + (w.sum || 0), 0);
    const parts = o.num != null ? X.partsByOrder[o.num] || [] : [];
    /* запчасти — все заказанные в наряде (и полученные, и «НЕТ»), кроме возвратов (с 10.11.2026) */
    const partsSum = parts.filter(p => !p.ret).reduce((s, p) => s + (p.sum || 0), 0);
    const partsWait = parts.filter(p => p.no && !p.ret).reduce((s, p) => s + (p.sum || 0), 0);
    const pays = o.num != null ? X.paysByOrder[o.num] || [] : [];
    const blkIds = [...new Set(parts.map(p => p.blk).filter(Boolean))];
    let debt = worksDebt(o, X) + o.works.reduce((s, w) => s + (w.done ? 0 : w.sum || 0), 0);
    let partsPaid = 0;
    blkIds.forEach(b => {
      const rows = X.blocks[b] || [];
      debt += blockDebt(rows);
      rows.forEach(p => { if (p.paid != null && !p.stockIn) partsPaid += p.paid; });
    });
    parts.filter(p => !p.blk).forEach(p => { if (!p.ret) debt += p.sum || 0; });
    const total = r2(works + partsSum);
    const waiting = parts.filter(p => p.no && !p.ret).length;
    return { works: r2(works), parts: r2(partsSum), partsWait: r2(partsWait), total, paid: r2((o.paid || 0) + partsPaid + appPaid(o, X)), debt: r2(debt), waiting, partsList: parts, paysList: pays };
  }
  STO.orderTotals = orderTotals;
  STO.blockDebt = blockDebt;

  function stockQty(s, D) {
    let q = s.qtyBase || 0;
    D.parts.forEach(p => {
      if (!p.app || p.ret || p.art !== s.art || p.no) return;
      if (p.stockIn) q += p.qty || 0;
      else if (p.sup === 'Склад') q -= p.qty || 0;
    });
    return r2(q);
  }
  STO.stockQty = stockQty;

  const isCash = t => t === 'Наличные' || t === '₽';

  /* Отчёт за месяц — как столбец листа «Итог_расчёт» */
  function monthReport(D, X, month, opts) {
    const cfg = D.cfg, start = taxStart(cfg), live = opts && opts.live;
    let works = 0, sub = 0, nik = 0;
    D.orders.forEach(o => o.works.forEach(w => {
      if (w.done && monthOf(w.done) === month) { works += w.sum || 0; sub += w.sub || 0; nik += w.nik || 0; }
    }));
    let partsSale = 0, partsCost = 0, oilCost = 0, stoExp = 0, piggy = 0, oilBuy = 0, salesForRevenue = 0, oilSoldCost = 0;
    D.parts.forEach(p => {
      const per = partPeriod(p, X);
      if (per === month && !p.no && !p.ret) {
        partsSale += p.sum || 0;
        partsCost += (p.cost || 0) * (p.qty || 0);
        oilCost += oilCostOf(p, X);
        if (!low(p.client).startsWith('сто')) salesForRevenue += p.sum || 0;
      }
      if (p.month === month) {
        if (p.client === 'СТО') stoExp += p.paid || 0;
        if (p.client === 'СТО (копилка)') piggy += p.sum || 0;
        if (p.client === 'СТО (масло/антифриз)') oilBuy += p.sum || 0;
        if (!p.no && !p.ret) oilSoldCost += oilCostOf(p, X);
      }
    });
    const stoProfit = works - sub - nik;
    const liveParts = partsSale - partsCost - oilCost;
    const liveItogo = stoProfit + liveParts - stoExp;
    const closed = !live && cfg.closed && cfg.closed[month];
    const partsProfit = closed ? closed.partsProfit : liveParts;
    const stoExpShown = closed ? closed.stoExp : stoExp;
    const itogo = stoProfit + partsProfit - stoExpShown;

    const taxMode = !!start && month >= start;
    const inMonth = p => monthOf(p.date) === month;
    let revenue = 0, withReceipt = 0, receipts = 0, card = 0, qr = 0, noMark = 0, refunds = 0;
    if (taxMode) {
      D.pays.forEach(p => {
        if (!inMonth(p)) return;
        if (p.refund && p.amount < 0) {
          if (p.receipt === true) { withReceipt += p.amount; refunds += -p.amount; }
          if (p.receipt === true) revenue += p.amount;
          return;
        }
        if (!(p.amount > 0)) return;
        if (p.receipt === true) { withReceipt += p.amount; receipts++; }
        if (p.receipt === true || p.receipt === false) revenue += p.amount;
        else if (p.order != null) noMark++;
        if (p.type === 'Карта') card += p.amount;
        if (p.type === 'QR') qr += p.amount;
      });
    } else {
      revenue = works + salesForRevenue;
      withReceipt = revenue;
    }
    const nowM = monthOf(todayISO());
    const status = closed ? (Math.round(liveItogo - closed.itogo) === 0 ? 'Закрыт' : 'Изменился') : month === nowM ? 'Текущий' : month < nowM ? 'Не закрыт' : '—';
    const out = {
      month, status, closed: closed || null, liveItogo: r2(liveItogo), diff: closed ? Math.round(liveItogo - closed.itogo) : 0, taxMode,
      works: r2(works), sub: r2(sub), nik: r2(nik), stoProfit: r2(stoProfit), partsSale: r2(partsSale), partsProfit: r2(partsProfit),
      stoExp: r2(stoExpShown), piggy: Math.round(piggy), oilBuy: Math.round(oilBuy), itogo: r2(itogo), revenue: r2(revenue),
      withReceipt: r2(withReceipt), withoutReceipt: r2(revenue - withReceipt), receipts, noMark, refunds: r2(refunds), tax: 0, fixedSum: 0, rest: null, oilSoldCost,
    };
    if (taxMode) {
      const pr = paramsFor(cfg, month);
      const rate = (pr.usn || 0) + (pr.extra || 0);
      const fixed = { rent: pr.rent || 0, acc: pr.acc || 0, elec: pr.elec || 0, term: pr.term || 0, vznos: (pr.vznosYear || 0) / 12, acqCard: card * (pr.acqCard || 0), acqQr: qr * (pr.acqQr || 0) };
      const fixedSum = Object.values(fixed).reduce((a, b) => a + b, 0);
      const paidByKind = {};
      let paidFixed = 0;
      D.pays.forEach(p => {
        if (!inMonth(p) || !X.fixed.has(low(p.name))) return;
        paidFixed -= p.amount; paidByKind[low(p.name)] = (paidByKind[low(p.name)] || 0) - p.amount;
      });
      Object.assign(out, { params: pr, rate, tax: r2(withReceipt * rate), fixed, fixedSum: r2(fixedSum), card: r2(card), qr: r2(qr), paidFixed: r2(paidFixed), paidByKind });
      out.rest = r2(itogo - out.tax - fixedSum);
    }
    return out;
  }
  STO.monthReport = monthReport;

  /* Деньги на конец месяца и движения за месяц (строки 44–56) */
  function money(D, X, month) {
    const eom = month + '-31';
    const acc = name => {
      const n = low(name);
      return D.pays.reduce((s, p) => (p.date <= eom && (p.type === 'безнал' || p.type === '₽/безнал') && low(p.name) === n ? s + p.amount : s), 0);
    };
    let cash = 0, ip = 0;
    D.pays.forEach(p => {
      if (p.date > eom) return;
      if (isCash(p.type) || p.type === '₽/безнал') cash += p.amount;
      if (p.type === 'Карта' || p.type === 'QR') ip += p.amount;
      else if (p.type === 'безнал' && (low(p.name) === 'ип карта (антон)' || X.fixed.has(low(p.name)))) ip += p.amount;
    });
    const inM = p => monthOf(p.date) === month;
    const zp = who => {
      const n = low(who);
      return D.pays.reduce((s, p) => {
        if (!inM(p) || low(p.name) !== n || low(p.note) !== 'зп') return s;
        if (isCash(p.type)) return s - p.amount;
        if (p.type === 'безнал') return s + p.amount;
        return s;
      }, 0);
    };
    const personal = -D.pays.reduce((s, p) => (inM(p) && low(p.name) === 'личные расходы' ? s + p.amount : s), 0);
    return { cash: r2(cash), anton: r2(acc('Антон')), gleb: r2(acc('Глеб')), piggy: r2(acc('Копилка')), ip: r2(ip), personal: r2(personal), zpGleb: r2(zp('Глеб')), zpAnton: r2(zp('Антон')) };
  }
  STO.money = money;

  /* Начислено налогов и постоянных расходов, но не оплачено (строка 80) */
  function unpaid(D, X, month) {
    const start = taxStart(D.cfg);
    if (!start || month < start) return null;
    let accrued = 0;
    for (let m = start; m <= month; m = addMonths(m, 1)) { const r = monthReport(D, X, m); accrued += r.tax + r.fixedSum; }
    const eom = month + '-31', from = start + '-01';
    const paid = -D.pays.reduce((s, p) => (p.date >= from && p.date <= eom && X.fixed.has(low(p.name)) ? s + p.amount : s), 0);
    return { accrued: r2(accrued), paid: r2(paid), left: r2(accrued - paid) };
  }
  STO.unpaid = unpaid;

  /* Счета Никиты и подрядчика: заработал по работам − выплачено, остаток переходит из месяца в месяц.
     Выплата Никите — запись с Назначением «Никита» без отметки чека и без наряда (оплата клиента всегда с чеком да/нет). */
  const WORKERS_START = { month: '2026-11', nik: 0, sub: 0 };
  function workerPaySign(p) { return isCash(p.type) ? -p.amount : p.type === 'безнал' ? p.amount : 0; }
  function isWorkerPay(p, who) {
    const n = low((p.name || '').trim());
    if (who === 'nik') return n === 'никита' && p.receipt == null && p.order == null && !p.link;
    return n === 'подрядчик';
  }
  function workers(D, X, month) {
    const st = Object.assign({}, WORKERS_START, D.cfg.workersStart || {});
    if (!month || month < st.month) return null;
    const res = {};
    ['nik', 'sub'].forEach(who => {
      let bal = st[who] || 0, open = bal, earned = 0, paid = 0, works = [], pays = [];
      for (let m = st.month; m <= month; m = addMonths(m, 1)) {
        let e = 0, pd = 0;
        D.orders.forEach(o => (o.works || []).forEach(w => {
          if (w.done && monthOf(w.done) === m && w[who]) { e += w[who]; if (m === month) works.push({ num: o.num, id: o.id, date: w.done, client: o.client, car: o.car, name: w.name, sum: w[who] }); }
        }));
        D.pays.forEach(p => {
          if (monthOf(p.date) !== m || !isWorkerPay(p, who)) return;
          const v = workerPaySign(p); if (!v) return;
          pd += v; if (m === month) pays.push({ id: p.id, date: p.date, sum: r2(v), type: p.type, note: p.note || '' });
        });
        if (m === month) { open = bal; earned = e; paid = pd; }
        bal += e - pd;
      }
      works.sort((a, b) => (a.date < b.date ? -1 : 1)); pays.sort((a, b) => (a.date < b.date ? -1 : 1));
      res[who] = { open: r2(open), earned: r2(earned), paid: r2(paid), left: r2(bal), works, pays };
    });
    res.start = st.month;
    return res;
  }
  STO.workers = workers;

  /* «На сегодня»: поставщики, возвраты, запчасти в машинах, «Наше», сверка (строки 48–49, 58–88) */
  function today(D, X, asOfDay) {
    const month = monthOf(asOfDay || todayISO());
    const rep = monthReport(D, X, month);
    const mon = money(D, X, month);
    const sups = (D.cfg.balanceSuppliers || ['Rossko', 'ПП', 'Mikado']).map(name => {
      const n = low(name);
      let bal = 0, retWait = 0;
      D.pays.forEach(p => {
        if (low(p.name) !== n) return;
        if (isCash(p.type)) bal -= p.amount;
        if (p.type === 'безнал') bal += p.amount;
      });
      D.parts.forEach(p => {
        if (low(p.sup) !== n) return;
        const c = (p.cost || 0) * (p.qty || 0);
        if (!p.no) bal -= c;
        if (p.ret && p.retDone) bal += c;
        if (p.ret && !p.retDone) retWait += c;
      });
      return { name, balance: r2(bal), retWait: r2(retWait) };
    });
    let notArrived = 0, notArrivedSale = 0, inCars = 0;
    D.parts.forEach(p => {
      if (p.no) { notArrived += (p.cost || 0) * (p.qty || 0); notArrivedSale += p.sum || 0; }
      if (!p.no && !p.ret && partPeriod(p, X) === 'work') inCars += (p.sum || 0) - (p.cost || 0) * (p.qty || 0) - oilCostOf(p, X);
    });
    // долги клиентов: столбцы V и R
    let debts = 0;
    Object.values(X.blocks).forEach(rows => { debts += blockDebt(rows); });
    D.parts.forEach(p => { if (!p.blk && !p.ret && p.order != null) debts += p.sum || 0; });
    D.orders.forEach(o => { debts += worksDebt(o, X); });
    const oilFund = D.pays.reduce((s, p) => (p.type === 'безнал' && low(p.name) === 'масло/антифриз' ? s + p.amount : s), 0) + rep.oilSoldCost;
    const ten = 0.1 * Math.max(0, rep.rest ?? 0);
    const paidOut = (who, zpOnly) => {
      const n = low(who);
      return D.pays.reduce((s, p) => {
        if (monthOf(p.date) !== month || low(p.name) !== n || (zpOnly && low(p.note) !== 'зп')) return s;
        if (isCash(p.type)) return s - p.amount;
        if (p.type === 'безнал') return s + p.amount;
        return s;
      }, 0);
    };
    const u = unpaid(D, X, month);
    const wk = workers(D, X, month);
    const nashe = {
      cash: mon.cash, notArrived: -notArrived, debts: r2(debts), shares: -(mon.anton + mon.gleb), suppliers: r2(sups.reduce((s, x) => s + x.balance, 0)),
      markupNotArrived: -(notArrivedSale - notArrived), piggy: -mon.piggy, oil: -oilFund, ten: -ten,
      workers: wk ? -(wk.nik.left + wk.sub.left) : -rep.sub + paidOut('Подрядчик') - rep.nik + paidOut('Никита', true), ip: mon.ip, inCars: -inCars, taxUnpaid: u ? -u.left : 0,
    };
    const nasheSum = Object.values(nashe).reduce((a, b) => a + b, 0);
    const retWait = sups.reduce((s, x) => s + x.retWait, 0);
    const check = (rep.rest ?? 0) - (mon.personal + mon.zpGleb + mon.zpAnton) - nasheSum + nashe.ten - retWait;
    return {
      month, rep, mon, sups, notArrived: r2(notArrived), inCars: r2(inCars), retWait: r2(retWait), oilFund: r2(oilFund), ten: r2(ten),
      nashe, nasheSum: r2(nasheSum), check: Math.round(check * 100) / 100, unpaid: u,
    };
  }
  STO.today = today;
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* AGservice — офлайн-версия: программа в файле, база в AGservice-база.json */
(function () {
  const S = window.STO;
  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n, d = 0) => (n == null || isNaN(n) ? '—' : (Math.abs(n) < 0.5 * Math.pow(10, -d) ? 0 : Number(n)).toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d }));
  /* рубли: копейки показываем, когда они есть — «5 634,23 ₽», а ровные суммы без «,00» — «1 006 ₽» */
  const rub = n => { if (n == null || isNaN(n)) return '—'; const v = Math.round(n * 100) / 100; return fmt(v, Math.abs(v % 1) > 0.004 ? 2 : 0) + ' ₽'; };
  const pct = n => fmt((n || 0) * 100, 2).replace(/,00$/, '') + '%';
  const dshort = iso => (iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(2, 4) : '');
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const clone = o => JSON.parse(JSON.stringify(o));
  const r2 = x => Math.round(x * 100) / 100;
  const low = S.low;
  const hasFS = typeof window.showOpenFilePicker === 'function';
  const NOW_M = () => S.monthOf(S.todayISO());

  /* ---------- состояние ---------- */
  let D = null;
  let X = null;
  const ui = {
    tab: 'orders', filter: 'open', q: '', limit: 40, month: NOW_M(), expMonth: NOW_M(), payMonth: NOW_M(), payQ: '', stockQ: '',
    editor: null, toast: '', openRows: new Set(), error: '', start: { busy: '', lastName: '' }, conflict: false, fileName: '', savedAt: null,
    importPreview: null, payForm: null, expForm: null, stockForm: null, confirmClose: false, schedForm: null,
  };
  try { const t = localStorage.getItem('sto.tab'); if (t) ui.tab = t; } catch (e) {}
  const THEMES = [['warm', 'Тёплая'], ['sand', 'Олива'], ['', 'Как в системе']];
  /* «Лампочка»: скрыть закупочные цены, когда клиент смотрит в монитор */
  function eyeBtn() {
    return `<button class="costeye" data-act="cost-eye" aria-label="Глаз"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path class="eye-off" d="M3 3l18 18" stroke="currentColor" stroke-width="2"/></svg></button>`;
  }
  function setCostHidden(on) {
    document.documentElement.classList.toggle('hide-cost', on);
    try { localStorage.setItem('sto.hideCost', on ? '1' : ''); } catch (e) {}

  }
  try { if (localStorage.getItem('sto.hideCost')) setTimeout(() => setCostHidden(true), 0); } catch (e) {}
  function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
  try { ui.theme = localStorage.getItem('sto.theme'); } catch (e) { ui.theme = null; }
  if (!THEMES.some(t => t[0] === ui.theme)) ui.theme = 'warm';
  applyTheme(ui.theme);
  /* Перерисовка, защищённая от вложенного вызова (blur/change при удалении поля с фокусом) */
  function setHTML(el, html) {
    if (setHTML.busy) { setTimeout(() => setHTML(el, html), 0); return; }
    setHTML.busy = true;
    try { el.innerHTML = html; } finally { setHTML.busy = false; }
  }

  }
  function numIn(v) { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(/\s| /g, '').replace(',', '.')); return isNaN(n) ? null : n; }

  /* ---------- отрисовка ---------- */
  /* телефон: открытая вкладка всегда видна, справа тень — «есть ещё» */
  function tabsFit() {
    const t = $('#tabs'), a = t && t.querySelector('.tab.on'); if (!t) return;
    if (a && t.scrollWidth > t.clientWidth) { const want = a.offsetLeft - (t.clientWidth - a.offsetWidth) / 2; if (a.offsetLeft < t.scrollLeft || a.offsetLeft + a.offsetWidth > t.scrollLeft + t.clientWidth) t.scrollLeft = want; }
    t.classList.toggle('more-r', t.scrollLeft + t.clientWidth < t.scrollWidth - 4);
    if (!t.dataset.sc) { t.dataset.sc = '1'; t.addEventListener('scroll', () => t.classList.toggle('more-r', t.scrollLeft + t.clientWidth < t.scrollWidth - 4), { passive: true }); }
  }
  function renumNoteHTML() {

  }
  function render() {
    const a = document.activeElement;
    const keep = a && a.id && a.closest('#view') ? { id: a.id, s: a.selectionStart, e: a.selectionEnd, v: a.value } : null;
    if (!D) { $('#tabs').innerHTML = ''; $('#view').innerHTML = viewStart(); paintStatus(); paintEditor(); return; }
    $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab${ui.tab === k ? ' on' : ''}" data-act="tab" data-k="${k}" ${ui.tab === k ? 'aria-current="page"' : ''}>${l}</button>`).join('');
    tabsFit();
    let html = banners() + renumNoteHTML();
    html += ({ orders: viewOrders, sales: viewSales, wait: viewWait, sched: viewSched, clients: viewClients, money: viewMoney, stock: viewStock, exps: viewExps, report: viewReport, log: viewLog, settings: viewSettings }[ui.tab] || viewOrders)();
    setHTML($('#view'), html);
    document.querySelectorAll('#view [data-mixed]').forEach(e => { e.indeterminate = true; });
    restoreFocus(keep);

  function paintStatus() {
    const el = $('#status');
    let t = '', c = 'ok';
    if (!D) { t = 'База не открыта'; c = 'wait'; }
    else if (cloud) {
      if (cl.needLogin) { t = 'Войди в Яндекс'; c = 'bad'; }
      else if (cl.busy) { t = 'Отправляю на Диск…'; c = 'wait'; }
      else if (cl.offline) { t = cl.pending ? 'Нет связи — изменения ждут отправки' : 'Нет связи с Диском'; c = 'wait'; }
      else if (cl.err) { t = 'Ошибка Диска'; c = 'bad'; }
      else if (cl.pending) { t = 'Ждёт отправки'; c = 'wait'; }
      else t = 'На Диске' + (cl.last ? ' ' + cl.last.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '');
      el.title = cl.err || (cl.pending ? 'Изменения сохранены на этом устройстве и уйдут на Яндекс Диск, когда будет связь' : 'База на Яндекс Диске');
    }
    else if (ui.conflict) { t = 'База изменилась снаружи'; c = 'bad'; }
    else if (!handle) { t = dirty ? 'Не сохранено — скачай базу' : 'Без автосохранения'; c = dirty ? 'bad' : 'wait'; }
    else if (saving || dirty) { t = 'Сохраняю…'; c = 'wait'; }
    else t = 'Сохранено' + (ui.savedAt ? ' ' + ui.savedAt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '');
    el.className = 'status ' + c; el.textContent = t;
    $('#fname').textContent = D ? ui.fileName : '';
    const ck = $('#ckbadge'), wb = $('#waitbadge');
    if (!D || !X || !X.T) { ck.hidden = true; if (wb) wb.hidden = true; return; }

    const v = X.T.check, ok = Math.abs(v) < 1;

    ck.title = (ok ? 'Сверка сходится' : 'Сверка не сходится') + (X.issues.length ? ' · подозрительных записей: ' + X.issues.length : '');
  }
  function banners() {
    let h = '';

      <div class="actions"><button class="btn" data-act="reload-base">Открыть новую версию (мои последние правки пропадут)</button><button class="btn danger" data-act="force-save">Записать мою версию поверх</button></div></div>`;

  function cloudStartHTML() {

  /* ----- Наряды ----- */
  function viewOrders() {
    const q = ui.q.trim().toLowerCase();
    const rows = D.orders.map(o => ({ o, t: S.orderTotals(o, X) }));
    const counts = { open: 0, debt: 0, wait: 0 };
    rows.forEach(({ o, t }) => { if (!o.doneDate) counts.open++; if (o.doneDate && t.debt > 5) counts.debt++; if (t.waiting) counts.wait++; });
    const hits = {};
    const list = rows.filter(({ o, t }) => {
      if (ui.filter === 'open' && o.doneDate) return false;
      if (ui.filter === 'debt' && !(o.doneDate && t.debt > 5)) return false;
      if (ui.filter === 'wait' && !t.waiting) return false;
      if (!q) return true;
      /* поиск внутри выбранного фильтра: клиент, машина, номер, а также запчасти (артикул, название, бренд) */
      const words = q.split(/\s+/);
      const head = [o.num, o.client, o.car, o.plate, o.vin, o.phone, o.note].join(' ').toLowerCase();
      const parts = o.num != null ? X.partsByOrder[o.num] || [] : [];
      if (words.every(w => head.includes(w))) return true;
      const hp = parts.filter(p => { const hay = head + ' ' + [p.art, p.name, p.brand].join(' ').toLowerCase(), an = rkNorm(p.art); return words.every(w => hay.includes(w) || (rkNorm(w).length >= 3 && an.includes(rkNorm(w)))); });
      if (!hp.length) return false;
      hits[o.id] = hp;
      return true;
    });
    const sk = o => o.start || o.doneDate || '9999';
    /* по убыванию номера наряда */
    const nk = o => o.num != null ? o.num : o.doneDate ? -1 : Infinity;   /* б/н в работе — сверху, старые сданные б/н — в конце */
    list.sort((a, b) => (nk(b.o) - nk(a.o)) || sk(b.o).localeCompare(sk(a.o)));
    const shown = list.slice(0, ui.limit);
    const chip = (k, l, n) => `<button class="chip${ui.filter === k ? ' on' : ''}" data-act="filter" data-k="${k}">${l}${n != null ? ` <b>${n}</b>` : ''}</button>`;
    const soon = D.schedule.filter(s => s.date >= S.todayISO()).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
    return `
      <div class="toolbar">
        <input id="q" class="search" type="search" placeholder="Поиск: клиент, авто, номер наряда, госномер, запчасть, артикул, бренд" value="${esc(ui.q)}" data-act="search" autocomplete="off">
        <button class="btn primary" data-act="new-order">+ Новый наряд</button>
      </div>
      ${soon.length ? `<div class="soon"><span class="muted small">Записаны:</span>${soon.map(s => `<span class="soon-i"><b>${dshort(s.date)}</b> ${esc(s.client)} · ${esc(s.car)}</span>`).join('')}<button class="link small" data-act="tab" data-k="sched">все</button></div>` : ''}
      <div class="chips">${chip('open', 'В работе', counts.open)}${chip('debt', 'С долгом', counts.debt)}${chip('wait', 'Ждут запчасти', counts.wait)}${chip('all', 'Все', null)}</div>
      ${shown.length ? `<ul class="orders">${shown.map(({ o, t }) => orderCard(o, t, hits[o.id])).join('')}</ul>` : `<p class="muted pad">${ui.filter === 'open' && !q ? 'Сейчас машин в работе нет.' : 'Ничего не нашлось.'}${q && ui.filter !== 'all' ? ' <button class="link small" data-act="filter" data-k="all">Искать во всех нарядах</button>' : ''}</p>`}
      ${list.length > shown.length ? `<button class="btn wide" data-act="more">Показать ещё (${list.length - shown.length})</button>` : ''}`;
  }
  function orderCard(o, t, hp) {
    const st = !o.doneDate ? ['st-work', 'В работе'] : t.debt > 5 ? ['st-debt', 'Долг'] : ['st-done', 'Сдан'];
    const date = o.doneDate ? 'сдан ' + dshort(o.doneDate) : o.start ? 'с ' + dshort(o.start) : '';
    const open = ui.openRows.has(o.id);
    return `<li class="${open ? 'is-open' : ''}"><div class="order" role="button" tabindex="0" aria-expanded="${open}" data-act="toggle-row" data-id="${esc(o.id)}">
      <span class="arr" aria-hidden="true">${open ? '▾' : '▸'}</span>
      <span class="o-num">${o.num != null ? '№ ' + o.num : 'б/н'}</span>
      <span class="o-main"><b>${esc(orderWho(o) || 'Без имени')}</b><span class="muted">${esc(o.car)}</span>${hp && hp.length ? `<span class="hit small">${hp.slice(0, 3).map(p => esc([p.art, p.name, p.brand].filter(Boolean).join(' · '))).join('; ')}${hp.length > 3 ? ' и ещё ' + (hp.length - 3) : ''}</span>` : ''}</span>

      <span class="o-sum"><b>${rub(t.total)}</b>${Math.abs(t.debt) > 5 ? `<span class="${t.debt > 0 ? 'neg' : 'pos'} small">${t.debt > 0 ? 'долг ' + rub(t.debt) : 'переплата ' + rub(-t.debt)}</span>` : ''}</span>

  function orderDetail(o, t) {

      <div class="d-actions"><button class="btn small primary" data-act="open-order" data-id="${esc(o.id)}">Открыть наряд</button><button class="btn small" data-act="print-order" data-id="${esc(o.id)}">Печать</button><button class="btn small" data-act="share-order" data-id="${esc(o.id)}" title="Отправить заказ-наряд в PDF">Поделиться</button></div>
    </div>`;
  }

  /* ----- редактор наряда ----- */
  const PAY_KINDS = [
    { k: 'cash', label: 'Касса (наличные)', type: 'Наличные' }, { k: 'card', label: 'ИП карта (Антон)', type: 'Карта' }, { k: 'qr', label: 'QR (Антон)', type: 'QR' },
    { k: 'anton', label: 'Перевод Антону', type: 'безнал', name: 'Антон' }, { k: 'gleb', label: 'Перевод Глебу', type: 'безнал', name: 'Глеб' },
  ];
  /* клиент платит безналом сразу поставщику (Rossko, Mikado…) — деньги ложатся на баланс поставщика */

  function onEditorInput(el) {

    if (el.dataset.act === 'att-q') { E.attachQ = el.value; paintEditor(); return; }

      const p = X.clientById[E.order.cid], c = p && p.cars.find(x => x.id === el.value);
      Object.assign(E.order, { carId: c ? c.id : null, car: c ? c.car : '', plate: c ? c.plate : '', vin: c ? c.vin : '' });
      paintEditor(); if (!c) setTimeout(() => { const f = $('#e-car'); if (f) f.focus(); }, 20);
      return;
    }
    if (el.dataset.ed) {
      const k = el.dataset.ed;
      E.order[k] = k === 'mileage' ? numIn(el.value) : el.value;
      if (k === 'plate') { clearTimeout(onEditorInput.pt); onEditorInput.pt = setTimeout(paintEditor, 400); }
      return;
    }
    if (el.dataset.edDone) { E.doneInput = el.value; return; }
    if (el.dataset.w != null) {
      const w = E.order.works[+el.dataset.w], k = el.dataset.k;
      if (k === 'name') {
        w.name = el.value;
        E.wsug = el.value.trim() ? { i: +el.dataset.w, q: el.value, sel: 0 } : null; paintEditor();
        const wt = D.workTypes.find(x => x.name === el.value) || D.workTypes.find(x => wk(x.name) === wk(el.value) || (x.aliases || []).some(a => wk(a) === wk(el.value)));
        if (wt && wt.price && !w.sum) { w.sum = wt.price; paintEditor(); }
        return;
      }
      w[k] = numIn(el.value); later();
      return;
    }
    if (el.dataset.p != null) {
      const p = E.parts[+el.dataset.p], k = el.dataset.k;
      if (k === 'sup') { const was = low(p.sup) === 'склад'; p.sup = el.value; if (low(p.sup) === 'склад') p.no = false; else if (was) p.no = true; paintEditor(); return; }
      if (['art', 'name', 'brand'].includes(k)) {
        p[k] = el.value;
        if (k === 'art' && p.sup === 'Склад') {
          const s = D.stock.find(x => x.art === el.value);
          if (s) { Object.assign(p, { name: s.name, brand: s.brand, price: s.price, cost: null }); p.sum = r2((p.price || 0) * (p.qty || 0)); paintEditor(); }

      if (k === 'oilCost') { p.oilArt = p.art; delete p.oilBase; delete p.oilFrom; if (p.oilCost == null) delete p.oilCost; return; }
      if (k === 'cost') p.price = S.markupPrice(D.cfg, p.cost);
      p.sum = r2((p.price || 0) * (p.qty || 0));
      later();
      return;
    }
    if (el.dataset.y != null) {
      const p = E.pays[+el.dataset.y], k = el.dataset.k;
      if (k === 'kind') { const kk = payKinds().find(x => x.k === el.value) || PAY_KINDS[0]; p.type = kk.type; p.to = kk.name || null; if (kk.sup) p.receipt = false; return; }
      p[k] = k === 'amount' ? numIn(el.value) : el.value;

  function saveOrder() {
    ui.stash = { editor: ui.editor };

    o.client = (o.client || '').trim(); o.note = (o.note || '').trim();
    if (E.picking && !o.cid) { E.err = 'Выбери клиента из списка или нажми «+ Новый клиент».'; paintEditor(true); return; }
    if (!o.client) { E.err = 'Впиши имя клиента.'; paintEditor(true); return; }
    let person = o.cid ? D.clients.find(x => x.id === o.cid) : null;
    if (!person) {
      const key = S.clientKey(o.client, o.note);
      const same = D.clients.find(x => S.clientKey(x.name, x.nick) === key);
      const namesakes = D.clients.filter(x => low(x.name) === low(o.client));
      if (E.isNew || E.newClient) {
        if (same || (namesakes.length && !o.note)) {
          E.err = same && o.note
            ? `Клиент «${label(same)}» уже есть в базе. Нажми «Найти в базе» и выбери его, или впиши другое прозвище.`
            : `Клиентов с именем «${o.client}» уже ${namesakes.length}: ${namesakes.slice(0, 15).map(x => x.nick || 'без прозвища').join(', ')}. Если это кто-то из них — нажми «Найти в базе». Если новый — впиши прозвище, чтобы не путать.`;
          paintEditor(true); return;
        }
        person = { id: uid('c'), name: o.client, nick: o.note, phone: o.phone ? S.normPhone(o.phone) : '', cars: [] };
        D.clients.push(person);
      } else if (same) person = same;
    }
    if (person) {
      o.cid = person.id; o.client = person.name; o.note = person.nick;
      if (o.phone && !person.phone) person.phone = S.normPhone(o.phone);
      let car = o.carId ? person.cars.find(x => x.id === o.carId) : null;
      if (!car && (o.vin || o.plate)) car = person.cars.find(x => (o.vin && x.vin === o.vin) || (o.plate && x.plate === o.plate));
      if (car) { if (o.car) car.car = o.car; if (o.plate) car.plate = o.plate; if (o.vin) car.vin = o.vin; }
      else if (o.car || o.vin || o.plate) { car = { id: uid('a'), car: o.car, plate: o.plate, vin: o.vin }; person.cars.push(car); }
      o.carId = car ? car.id : null;

    E.pays = E.pays.filter(p => !p.app || p.amount);
    if (E.pays.some(p => p.app && p.receipt == null)) { E.err = 'У каждой оплаты отметь, пробит ли чек (Да или Нет). Без отметки оплата не попадёт в выручку.'; paintEditor(); return; }
    o.works = o.works.filter(w => (w.name || '').trim() || w.sum);
    E.parts = E.parts.filter(p => (p.name || '').trim() || p.art || p.sum);
    if (o.num == null && (E.parts.length || E.pays.length)) o.num = nextNum();
    if (o.doneDate) o.works.forEach(w => { if (!w.done) w.done = o.doneDate; });
    const touched = markEdited(o, E.parts);
    const old = D.orders.find(x => x.id === o.id);
    const oldNum = old ? old.num : null;
    if (oldNum != null) { D.parts = D.parts.filter(p => p.order !== oldNum); D.pays = D.pays.filter(p => p.order !== oldNum); }
    const movedIds = new Set(E.parts.map(p => p.id).concat((E.detached || []).map(p => p.id)));
    D.parts = D.parts.filter(p => !movedIds.has(p.id));
    const payIds = new Set(E.pays.map(p => p.id).concat((E.detachedPays || []).map(p => p.id)));
    D.pays = D.pays.filter(p => !payIds.has(p.id));
    (E.detached || []).forEach(p => { p.order = null; if (p.saleWas) { Object.assign(p, p.saleWas); if (!p.saleWas.cid) delete p.cid; } delete p.saleWas; delete p.fromSale; delete p.keepMonth; D.parts.push(p); if (p.link) D.pays.forEach(y => { if (y.link === p.link) y.order = null; }); });
    (E.detachedPays || []).forEach(y => { y.order = null; D.pays.push(y); });
    D.parts.forEach(p => { if (touched.has(p.blk)) p.edited = true; });
    D.orders = D.orders.filter(x => x.id !== o.id).concat([o]);
    E.parts.forEach(p => {
      if (p.link) D.pays.forEach(y => { if (y.link === p.link) y.order = o.num; });
      delete p.fromSale;
      Object.assign(p, { order: o.num, client: o.client, car: o.car, note: o.note, vin: o.vin, plate: o.plate, phone: o.phone });

    if (ui.cdraft && ui.cdraft.id && person && ui.cdraft.id === person.id) ui.cdraft = clone(person);

  function rubWords(n) {
    n = Math.round(Math.abs(n) * 100) / 100;

    const u = [['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'], ['', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять']];
    const teen = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
    const tens = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
    const hund = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот'];
    const form = (x, f) => { x = x % 100; if (x > 10 && x < 20) return f[2]; x = x % 10; return x === 1 ? f[0] : x >= 2 && x <= 4 ? f[1] : f[2]; };
    const tri = (x, g) => { const w = [hund[Math.floor(x / 100)]]; const t = x % 100; if (t >= 10 && t < 20) w.push(teen[t - 10]); else { w.push(tens[Math.floor(t / 10)]); w.push(u[g][t % 10]); } return w.filter(Boolean).join(' '); };

    [[1e9, 0, ['миллиард', 'миллиарда', 'миллиардов']], [1e6, 0, ['миллион', 'миллиона', 'миллионов']], [1e3, 1, ['тысяча', 'тысячи', 'тысяч']]].forEach(([d, g, f]) => { const x = Math.floor(r / d); if (x) { parts.push(tri(x, g) + ' ' + form(x, f)); r %= d; } });

  /* ----- «Поделиться»: заказ-наряд в PDF и системное окно «Отправить» (почта, Telegram…) ----- */
  /* PDF делается прямо в браузере, без интернета: страница рисуется в картинку (через SVG), картинки собираются в PDF */
  /* стили для картинки страницы: берём только те правила, что действуют сейчас на экране
     (иначе внутри картинки сработали бы правила для узкого экрана, и раскладка разъехалась бы) */
  function pdfCss() {
    const out = [];
    const walk = rules => [...rules].forEach(r => {
      if (r.type === 4 /* @media */) { if (window.matchMedia(r.conditionText || r.media.mediaText).matches) walk(r.cssRules); }
      else if (r.type === 1 || r.type === 5 /* обычное правило, @font-face */) out.push(r.cssText);
    });
    [...document.styleSheets].forEach(sh => { try { walk(sh.cssRules); } catch (e) {} });
    /* программа открывается в «старом» режиме браузера, а картинка — в обычном: повторяем правило старого режима для таблиц */
    if (document.compatMode === 'BackCompat') out.unshift('table { white-space: normal; line-height: normal; font-weight: normal; font-size: medium; font-variant: normal; font-style: normal; text-align: start; }');
    return out.join('\n');
  }
  function svgShot(xhtml, css, W, y, h, scale) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W * scale}" height="${h * scale}" viewBox="0 0 ${W} ${h}"><foreignObject x="0" y="0" width="${W}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="all:initial;display:block;width:${W}px;height:${h}px;overflow:hidden;background:#fff"><style>${css.replace(/<\/style/gi, '')}</style><div style="all:initial;display:block;width:${W}px;margin-top:${-y}px">${xhtml}</div></div></foreignObject></svg>`;
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => { const c = document.createElement('canvas'); c.width = Math.round(W * scale); c.height = Math.round(h * scale); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); res(c); };

  function canvasJpeg(c) { return new Promise(res => c.toBlob(b => b.arrayBuffer().then(a => res(new Uint8Array(a))), 'image/jpeg', 0.9)); }
  /* простейший PDF: на каждой странице A4 — одна картинка */
  function buildPdf(pages) {
    const enc = new TextEncoder(), chunks = [], offs = []; let len = 0;
    const put = x => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; };
    const obj = (n, body) => { offs[n] = len; put(n + ' 0 obj\n'); body(); put('\nendobj\n'); };
    const PW = 595.28, PH = 841.89, n = pages.length;
    put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    obj(1, () => put('<< /Type /Catalog /Pages 2 0 R >>'));
    obj(2, () => put('<< /Type /Pages /Count ' + n + ' /Kids [' + pages.map((_, i) => (3 + i * 3) + ' 0 R').join(' ') + '] >>'));
    pages.forEach((p, i) => {
      const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2;
      const w = PW, h = p.hFrac * PH, yTop = p.topFrac * PH;
      const cs = `q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} 0 ${(PH - yTop - h).toFixed(2)} cm /Im0 Do Q`;
      obj(pid, () => put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
      obj(cid, () => { put(`<< /Length ${cs.length} >>\nstream\n`); put(cs); put('\nendstream'); });
      obj(iid, () => { put(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`); put(p.jpg); put('\nendstream'); });
    });

    put('xref\n0 ' + total + '\n0000000000 65535 f \n');
    for (let k = 1; k < total; k++) put(String(offs[k]).padStart(10, '0') + ' 00000 n \n');

    return new Blob(chunks, { type: 'application/pdf' });
  }
  async function makePdf(html) {
    const stage = document.createElement('div');
    /* «all:initial» — чтобы раскладка тут и в картинке страницы была одинаковой */
    stage.style.cssText = 'position:fixed;left:-10000px;top:0;z-index:-1';
    stage.innerHTML = '<div style="all:initial;display:block;width:794px;background:#fff">' + html + '</div>'; document.body.appendChild(stage);
    try {
      const imgs = [...stage.querySelectorAll('img')];
      await Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
      const zn = stage.querySelector('.zn') || stage;
      zn.style.boxDecorationBreak = 'slice'; zn.style.webkitBoxDecorationBreak = 'slice';
      const W = 794, pageH = Math.round(W * 297 / 210), top = zn.getBoundingClientRect().top;
      /* высота по последнему блоку (у бланка для печати задана высота листа — пустой хвост не нужен) */
      const H = Math.min(zn.scrollHeight, Math.max(...[...zn.children].map(el => Math.round(el.getBoundingClientRect().bottom - top))) + Math.round(W * 8 / 210));
      /* резать страницы только между блоками и строками таблиц */
      const cuts = new Set([H]);
      zn.querySelectorAll(':scope > *, .zn-blk, .zn-t tr').forEach(el => { const r = el.getBoundingClientRect(); cuts.add(Math.round(r.bottom - top)); cuts.add(Math.round(r.top - top)); });
      /* внутри блока (итоги, текст внизу + подписи) не режем */
      const blocks = [...zn.querySelectorAll('.zn-blk')].map(el => { const r = el.getBoundingClientRect(); return [Math.round(r.top - top), Math.round(r.bottom - top)]; });
      const sorted = [...cuts].filter(v => v > 0 && !blocks.some(([t, b]) => v > t + 1 && v < b - 1)).sort((a, b) => a - b);
      const xhtml = new XMLSerializer().serializeToString(zn), css = pdfCss(), scale = 2;
      const padTop = Math.round(W * 10 / 210), padBot = Math.round(W * 8 / 210);
      const pages = []; let y = 0, first = true;
      while (y < H - 2) {
        const room = pageH - (first ? 0 : padTop) - padBot;
        let end = sorted.filter(c => c > y + 40 && c <= y + room).pop();
        if (!end) end = Math.min(y + room, H);
        const c = await svgShot(xhtml, css, W, y, end - y, scale);
        pages.push({ jpg: await canvasJpeg(c), w: c.width, h: c.height, hFrac: (end - y) / pageH, topFrac: first ? 0 : padTop / pageH });
        y = end; first = false;
      }
      return buildPdf(pages);
    } finally { stage.remove(); }
  }
  async function sharePdf(html, title) {
    if (ui.pdfBusy) return;

  function buildSales() {

      g.client = f.client; g.note = f.note || ''; g.car = f.car || '';

      if (k === 'supHow') { Sx.supHow = el.value; return; }
      if (k === 'client') {
        const r = X.crows.find(x => label(x.p) + ' — ' + (x.c ? x.c.car : '') === el.value);
        const wasOwn = isOwn(Sx.client);
        if (r) { Sx.client = r.p.name; Sx.note = r.p.nick; Sx.cid = r.p.id; Sx.car = r.c ? r.c.car : ''; }
        else { Sx.client = el.value.trim(); Sx.note = ''; Sx.cid = null; }
        if (isOwn(Sx.client) !== wasOwn) Sx.rows.forEach(p => { if (p.cost != null) { p.price = salePrice(p.cost); p.sum = r2((p.price || 0) * (p.qty || 0)); } });
        if (r || isOwn(Sx.client) !== wasOwn) paintSale();
        return;
      }
      Sx[k] = el.value; if (k === 'date') Sx.rows.forEach(p => { if (p.app) p.date = el.value; });
      return;
    }
    if (el.dataset.sp != null) {
      const p = Sx.rows[+el.dataset.sp], k = el.dataset.k;
      if (k === 'sup') { const was = low(p.sup) === 'склад'; p.sup = el.value; if (low(p.sup) === 'склад') p.no = false; else if (was) p.no = true; paintSale(); return; }
      if (['art', 'name', 'brand'].includes(k)) {
        p[k] = el.value;
        if (k === 'art' && p.sup === 'Склад') { const st = D.stock.find(x => x.art === el.value); if (st) { Object.assign(p, { name: st.name, brand: st.brand, price: isOwn(Sx.client) ? st.cost || st.price : st.price, cost: null }); p.sum = r2((p.price || 0) * (p.qty || 0)); paintSale(); } }
        return;
      }
      p[k] = numIn(el.value);
      if (k === 'oilCost') { p.oilArt = p.art; delete p.oilBase; delete p.oilFrom; if (p.oilCost == null) delete p.oilCost; return; }
      if (k === 'cost') p.price = salePrice(p.cost);
      p.sum = r2((p.price || 0) * (p.qty || 0));
      clearTimeout(ui.saT); ui.saT = setTimeout(() => paintSale(), 400);
      return;
    }
    if (el.dataset.sy != null) {
      const p = Sx.pays[+el.dataset.sy], k = el.dataset.k;

    if (el.dataset.sapq != null) { Sx.paste.items[+el.dataset.sapq].qty = numIn(el.value) || 0; return; }
    if (el.dataset.sapc != null) { Sx.paste.items[+el.dataset.sapc].on = el.checked; paintSale(); return; }
    if (el.dataset.act === 'sa-paste-sup') { Sx.paste.sup = el.value; return; }

  }
  function saveSale() {
    ui.stash = { sale: ui.sale };

    const rows = Sx.rows.filter(p => (p.name || '').trim() || p.art || p.sum);
    if (!rows.length) { Sx.err = 'Добавь хотя бы одну запчасть.'; paintSale(true); return; }

    const t = saleTotals();
    const link = Sx.link || uid('k');
    const oldIds = new Set(Sx.origRows.map(p => p.id));
    D.parts = D.parts.filter(p => !oldIds.has(p.id));
    D.pays = D.pays.filter(p => !(Sx.link && p.link === Sx.link));
    const changedRows = JSON.stringify(rows.map(p => [p.id, p.sup, p.art, p.name, p.cost, p.qty, p.price, p.sum, p.no, p.ret, p.retDone])) !== JSON.stringify(Sx.origRows.map(p => [p.id, p.sup, p.art, p.name, p.cost, p.qty, p.price, p.sum, p.no, p.ret, p.retDone]));
    const origPaid = r2(Sx.origRows.reduce((a, p) => a + (p.paid || 0), 0));
    const blk = rows[0].id;
    rows.forEach((p, i) => {
      Object.assign(p, { order: null, client: Sx.client, note: Sx.note || '', car: Sx.car || '', cid: Sx.cid || undefined, blk, link, paid: i === 0 ? t.paid : null });
      if (!p.date) p.date = Sx.date;
      if (p.app) p.month = S.monthOf(p.date);
      if (!p.app && (changedRows || Math.abs(t.paid - origPaid) > 0.005 || (Sx.origRows.length && Sx.origRows[0].id !== blk))) p.edited = true;
      D.parts.push(p);
    });
    const what = rows.length === 1 ? rows[0].name : rows[0].name + ' и ещё ' + (rows.length - 1) + ' поз.';
    if (own && Sx.personal) D.pays.push({ id: uid('y'), date: Sx.date, order: null, amount: -t.sum, type: 'безнал', receipt: null, name: Sx.client, note: 'Запчасти себе: ' + what, app: true, link });
    const stockOnly = rows.length > 0 && rows.every(p => low(p.sup) === 'склад');
    if (!own) Sx.pays.forEach(p => D.pays.push(Object.assign(p, { order: null, name: p.to || (Sx.client + ' ' + (Sx.note || '') + ' ' + Sx.car).replace(/\s+/g, ' ').trim(), note: p.to ? Sx.client + (stockOnly ? ': со склада' : ': запчасти') : (stockOnly ? 'Со склада' : 'Запчасти'), app: true, link })));
    if (t.costOther && Sx.supHow !== 'none') { const y = payFor(Sx.supHow, -t.costOther, Sx.date, 'Закупка: ' + what, link); y.supPay = true; y.how = Sx.supHow; D.pays.push(y); }
    ui.sale = null; paintSale();
    toast('Продажа сохранена'); changed();
  }

  function stockSalesHTML(s) {
    const n = a => String(a || '').replace(/[^0-9A-Za-zА-Яа-яЁё]/g, '').toUpperCase(), art = n(s.art);
    const rows = D.parts.filter(p => low(p.sup) === 'склад' && !p.stockIn && (art ? n(p.art) === art : low(p.name) === low(s.name)))
      .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    if (!rows.length) return '<p class="muted small">Продаж ещё не было.</p>';
    /* текущая бочка «по остатку»: сначала уходит старое масло, потом новое.
       Идём по покупкам от новой к старой, пока не наберётся остаток на складе — та, на которой набралось, и есть открытая */
    const all = ui.openRows.has('stk-all-' + s.id);
    const buys = D.parts.filter(p => low(p.client).startsWith('сто') && !p.ret && (+p.qty || 0) > 0 && (art ? n(p.art) === art : low(p.name) === low(s.name)))
      .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const R = S.stockQty(s, D);
    let cur = null, inCur = 0, sealed = 0, sealedL = 0;
    if (buys.length) {
      let cum = 0;
      for (let k = buys.length - 1; k >= 0; k--) {
        const v = +buys[k].qty || 0;
        if (cum + v >= R - 0.001) { cur = buys[k]; inCur = Math.max(0, R - cum); break; }
        cum += v; sealed++; sealedL += v;
      }
      if (!cur) { cur = buys[0]; inCur = R - cum; }
    }
    const used = cur ? Math.max(0, (+cur.qty || 0) - inCur) : 60;
    let acc = 0, shown = rows;
    if (!all) { shown = []; for (const p of rows) { if (acc >= used - 0.001) break; shown.push(p); if (!p.ret && !p.no) acc += +p.qty || 0; } }
    const total = shown.filter(p => !p.ret && !p.no).reduce((a, p) => a + (+p.qty || 0), 0);
    const L = v => fmt(v, v % 1 ? 2 : 0) + ' л';
    const head = cur
      ? `Сейчас льёшь из покупки от <b>${dshort(cur.date)}</b> (${L(+cur.qty || 0)}): продано <b>${L(used)}</b>, осталось <b>${L(inCur)}</b>${sealed ? ` · ещё не вскрыто: ${sealed} (${L(sealedL)})` : ''}${R < -0.001 ? ' · <span class="neg">остаток на складе в минусе — проверь</span>' : ''}`
      : 'Покупок этой позиции не нашёл — показываю последние 60 л';
    const more = rows.length - shown.length;
    return `<div class="small" style="margin-bottom:6px">${all ? `Все продажи: продано <b>${L(total)}</b> · записей ${shown.length}` : head}${more > 0 || all ? ` · <button class="link small" data-act="toggle-row" data-id="stk-all-${esc(s.id)}">${all ? 'только текущая' : 'показать все (' + rows.length + ')'}</button>` : ''}</div>
      <table class="tbl stk-sales"><thead><tr><th>Дата</th><th>Кому</th><th class="r">Сколько</th><th class="r">Сумма</th><th>Наряд</th></tr></thead><tbody>
      ${shown.map(p => { const o = p.order != null ? X.ordersByNum[p.order] : null;
        const who = o ? orderWho(o) : ((p.client || '') + (p.note ? ' ' + p.note : '')).trim() || '—';
        return `<tr><td class="nowrap">${dshort(p.date)}</td><td>${esc(who)}${o && o.car ? `<div class="muted small">${esc(o.car)}</div>` : ''}${p.ret ? ' <span class="pill st-debt">возврат</span>' : ''}${p.no ? ' <span class="pill st-wait">не выдано</span>' : ''}</td>

  function trendChart(m) {
